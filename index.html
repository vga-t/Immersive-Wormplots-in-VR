<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Immersive WebXR wormplot visualization for spatial analytics">
    <title>Immersive Wormplots in VR</title>
    <script src="https://cdn.jsdelivr.net/npm/danfojs@1.1.2/lib/bundle.min.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js"></script>
    <script src="https://cdn.babylonjs.com/webxr/babylon.webXR.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #fpsCounter {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 5px 10px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 4px;
            z-index: 999;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
            z-index: 999;
            color: white;
            font-family: sans-serif;
            font-size: 13px;
        }
        select {
            margin: 4px;
            border-radius: 3px;
            padding: 2px 6px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="fpsCounter"></div>
    <div id="controls">
        <select id="datasetSelect">
            <option value="Weather">Weather Data</option>
            <option value="WeatherDetailed">Weather Data Detailed</option>
            <option value="Toxicology">Toxicology Data</option>
        </select>
        <select id="attribute1Select"></select>
        <select id="attribute2Select"></select>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
