<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%">
  <defs>
    <!-- Arrow marker for axes and annotations -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="currentColor" opacity="0.8"/>
    </marker>
    <marker id="pointer" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="currentColor" />
    </marker>
  </defs>

  <style>
    /* Typography */
    .title-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: currentColor; text-anchor: middle; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: bold; font-style: italic; fill: currentColor; }
    .annotation-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: currentColor; }
    .annotation-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; font-style: italic; fill: currentColor; opacity: 0.7; }
    
    /* 3D Spacetime Worm Surfaces (Using opacity for adaptive glass effect) */
    .worm-face-front { fill: currentColor; opacity: 0.12; }
    .worm-face-back { fill: currentColor; opacity: 0.05; }
    .worm-edge { stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.4; fill: none; }
    
    /* 2D Boxplot Cross-Sections */
    .cross-section-diamond { stroke: currentColor; stroke-width: 2.5; fill: none; }
    .cross-section-whisker { stroke: currentColor; stroke-width: 1.5; }
    .cross-section-node { fill: currentColor; }
    
    /* Infrastructure */
    .time-axis { stroke: currentColor; stroke-width: 2; opacity: 0.8; }
    .guide-line { stroke: currentColor; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.3; }
    .pointer-line { stroke: currentColor; stroke-width: 1.5; fill: none; }
  </style>

  <!-- ========================================== -->
  <!-- THE 3D SPACETIME WORM (SURFACES & EDGES) -->
  <!-- ========================================== -->

  <!-- BACK FACES (Rendered first to appear behind) -->
  <!-- T1 to T2 Back Faces -->
  <polygon points="150,160 450,110 380,200 110,240" class="worm-face-back" />
  <polygon points="110,240 380,200 450,330 150,340" class="worm-face-back" />
  <!-- T2 to T3 Back Faces -->
  <polygon points="450,110 750,200 710,260 380,200" class="worm-face-back" />
  <polygon points="380,200 710,260 750,340 450,330" class="worm-face-back" />

  <!-- LONGITUDINAL EDGES (Connecting the vertices) -->
  <polyline points="150,160 450,110 750,200" class="worm-edge" /> <!-- Top -->
  <polyline points="190,260 520,240 790,280" class="worm-edge" /> <!-- Right -->
  <polyline points="150,340 450,330 750,340" class="worm-edge" /> <!-- Bottom -->
  <polyline points="110,240 380,200 710,260" class="worm-edge" /> <!-- Left -->

  <!-- FRONT FACES (Rendered on top for depth) -->
  <!-- T1 to T2 Front Faces -->
  <polygon points="150,160 450,110 520,240 190,260" class="worm-face-front" />
  <polygon points="190,260 520,240 450,330 150,340" class="worm-face-front" />
  <!-- T2 to T3 Front Faces -->
  <polygon points="450,110 750,200 790,280 520,240" class="worm-face-front" />
  <polygon points="520,240 790,280 750,340 450,330" class="worm-face-front" />


  <!-- ========================================== -->
  <!-- 2D BOXPLOT CROSS-SECTIONS (T1, T2, T3) -->
  <!-- ========================================== -->

  <!-- CROSS-SECTION AT T1 (x=150) -->
  <g>
    <!-- Whiskers -->
    <line x1="150" y1="160" x2="150" y2="110" class="cross-section-whisker" />
    <line x1="140" y1="110" x2="160" y2="110" class="cross-section-whisker" />
    
    <line x1="150" y1="340" x2="150" y2="390" class="cross-section-whisker" />
    <line x1="140" y1="390" x2="160" y2="390" class="cross-section-whisker" />
    
    <line x1="190" y1="260" x2="230" y2="270" class="cross-section-whisker" />
    <line x1="228" y1="260" x2="232" y2="280" class="cross-section-whisker" />
    
    <line x1="110" y1="240" x2="70" y2="230" class="cross-section-whisker" />
    <line x1="68" y1="220" x2="72" y2="240" class="cross-section-whisker" />

    <!-- Diamond -->
    <polygon points="150,160 190,260 150,340 110,240" class="cross-section-diamond" />
    
    <!-- Median Node -->
    <circle cx="150" cy="250" r="3.5" class="cross-section-node" />
    
    <!-- Title Guide -->
    <line x1="150" y1="100" x2="150" y2="60" class="guide-line" />
    <text x="150" y="50" class="title-label">2D Boxplot at T1</text>
  </g>

  <!-- CROSS-SECTION AT T2 (x=450) -->
  <g>
    <!-- Whiskers -->
    <line x1="450" y1="110" x2="450" y2="50" class="cross-section-whisker" />
    <line x1="440" y1="50" x2="460" y2="50" class="cross-section-whisker" />
    
    <line x1="450" y1="330" x2="450" y2="380" class="cross-section-whisker" />
    <line x1="440" y1="380" x2="460" y2="380" class="cross-section-whisker" />
    
    <line x1="520" y1="240" x2="570" y2="250" class="cross-section-whisker" />
    <line x1="568" y1="240" x2="572" y2="260" class="cross-section-whisker" />
    
    <line x1="380" y1="200" x2="330" y2="190" class="cross-section-whisker" />
    <line x1="328" y1="180" x2="332" y2="200" class="cross-section-whisker" />

    <!-- Diamond -->
    <polygon points="450,110 520,240 450,330 380,200" class="cross-section-diamond" />
    
    <!-- Median Node -->
    <circle cx="450" cy="220" r="3.5" class="cross-section-node" />
    
    <!-- Title Guide -->
    <line x1="450" y1="40" x2="450" y2="15" class="guide-line" />
    <text x="450" y="50" class="title-label">2D Boxplot at T2</text>
  </g>

  <!-- CROSS-SECTION AT T3 (x=750) -->
  <g>
    <!-- Whiskers -->
    <line x1="750" y1="200" x2="750" y2="160" class="cross-section-whisker" />
    <line x1="740" y1="160" x2="760" y2="160" class="cross-section-whisker" />
    
    <line x1="750" y1="340" x2="750" y2="380" class="cross-section-whisker" />
    <line x1="740" y1="380" x2="760" y2="380" class="cross-section-whisker" />
    
    <line x1="790" y1="280" x2="820" y2="290" class="cross-section-whisker" />
    <line x1="818" y1="280" x2="822" y2="300" class="cross-section-whisker" />
    
    <line x1="710" y1="260" x2="680" y2="250" class="cross-section-whisker" />
    <line x1="678" y1="240" x2="682" y2="260" class="cross-section-whisker" />

    <!-- Diamond -->
    <polygon points="750,200 790,280 750,340 710,260" class="cross-section-diamond" />
    
    <!-- Median Node -->
    <circle cx="750" cy="270" r="3.5" class="cross-section-node" />
    
    <!-- Title Guide -->
    <line x1="750" y1="150" x2="750" y2="60" class="guide-line" />
    <text x="750" y="50" class="title-label">2D Boxplot at T3</text>
  </g>

  <!-- ========================================== -->
  <!-- INFRASTRUCTURE & ANNOTATIONS -->
  <!-- ========================================== -->

  <!-- Temporal Z-Axis -->
  <line x1="50" y1="460" x2="850" y2="460" class="time-axis" marker-end="url(#arrow)" />
  <text x="845" y="445" text-anchor="end" class="axis-label">Time (Z-axis)</text>
  
  <!-- Time Ticks & Projections -->
  <line x1="150" y1="455" x2="150" y2="465" class="time-axis" />
  <line x1="150" y1="455" x2="150" y2="395" class="guide-line" />
  <text x="150" y="485" class="title-label">T1</text>

  <line x1="450" y1="455" x2="450" y2="465" class="time-axis" />
  <line x1="450" y1="455" x2="450" y2="385" class="guide-line" />
  <text x="450" y="485" class="title-label">T2</text>

  <line x1="750" y1="455" x2="750" y2="465" class="time-axis" />
  <line x1="750" y1="455" x2="750" y2="385" class="guide-line" />
  <text x="750" y="485" class="title-label">T3</text>

  <!-- Main Worm Annotation -->
  <path d="M 640,90 Q 600,90 550,150" class="pointer-line" marker-end="url(#pointer)" />
  <text x="645" y="85" class="annotation-title">Continuous 3D Spacetime Worm</text>
  <text x="645" y="105" class="annotation-sub">Meshes interpolate between timestamp nodes</text>

</svg>
